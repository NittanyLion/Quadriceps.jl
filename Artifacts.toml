# The 80-digit rules: the two archives of the Zenodo deposit (record 10.5281/zenodo.22881864),
# fetched lazily — only when ghpos / lepos is asked for a number type wider than 113 bits — and
# verified by Pkg against the SHA-256 of the archive and the git tree hash of its contents.
# The hashes are those of the published record's files; a new version of the deposit is a new
# record, so these entries change only when the package moves to it. See src/extended.jl.

